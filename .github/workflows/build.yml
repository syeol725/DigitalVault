name: Build Windows DigitalVault

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run security regression tests
        run: python -m unittest -v test_security.py

      - name: Build executable
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name DigitalVault digital_vault.py

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item dist/DigitalVault.exe package/
          Copy-Item README.md package/
          Copy-Item USB-사용법.txt package/
          Copy-Item LICENSE.txt package/

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DigitalVault-Windows-x64
          path: package/
          if-no-files-found: error
