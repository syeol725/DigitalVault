
name: Build portable apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DigitalVault-Windows-x64
            executable: dist/DigitalVault.exe
          - os: macos-latest
            artifact: DigitalVault-macOS
            executable: dist/DigitalVault
          - os: ubuntu-latest
            artifact: DigitalVault-Linux-x64
            executable: dist/DigitalVault

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name DigitalVault digital_vault.py

      - name: Prepare portable package
        shell: bash
        run: |
          mkdir -p package
          cp "${{ matrix.executable }}" package/
          cp README.md package/
          cp USB-사용법.txt package/
          cp LICENSE.txt package/
          echo "DigitalVaultData/" > package/USB_DATA_FOLDER.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
